<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Paresalamat</title>
  <link rel="icon" type="image/jpeg" href="Pares.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .login-wrapper {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: var(--cream-light);
    }
    .login-box {
      background: var(--white); padding: 3rem; border-radius: var(--radius-xl);
      box-shadow: var(--shadow-soft); width: 100%; max-width: 400px; text-align: center;
    }
    .login-logo { font-family: var(--font-brand); font-size: 2.5rem; color: var(--red); margin-bottom: 1.5rem; }
    .login-logo em { font-style: normal; color: var(--brown); }
    .error-msg { color: var(--red); font-size: 0.85rem; font-weight: 700; margin-bottom: 1rem; display: none; }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-box">
      <div class="login-logo">Pares<em>alamat</em></div>
      <h2 style="font-family: var(--font-body); color: var(--text-dark); margin-bottom: 1.5rem; font-size: 1.2rem;">Admin Access</h2>
      
      <div class="error-msg" id="loginError">Incorrect username or password.</div>

      <div class="form-group" style="text-align: left;">
        <label>Username</label>
        <input type="text" id="adminUser" placeholder="Enter username" />
      </div>
      <div class="form-group" style="text-align: left;">
        <label>Password</label>
        <input type="password" id="adminPass" placeholder="Enter password" />
      </div>

      <button class="btn-primary" style="width: 100%; margin-top: 1rem;" onclick="attemptLogin()">Log In</button>
      <a href="index.html" class="btn-ghost" style="width: 100%; margin-top: 0.75rem;">Return to Website</a>
    </div>
  </div>

  <script>
    // Simple Frontend Authentication
    function attemptLogin() {
      const user = document.getElementById("adminUser").value;
      const pass = document.getElementById("adminPass").value;

      // SET YOUR ADMIN CREDENTIALS HERE
      if (user === "admin" && pass === "paresalamat2024") {
        localStorage.setItem("paresAdminAuth", "true");
        window.location.href = "admin.html";
      } else {
        document.getElementById("loginError").style.display = "block";
      }
    }
  </script>
</body>
</html>
