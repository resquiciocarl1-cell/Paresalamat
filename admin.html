<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Paresalamat</title>
  <link rel="icon" type="image/jpeg" href="Pares.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-body">

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <span class="logo-text">Pares<em>alamat</em></span>
        <p>Admin Dashboard</p>
      </div>
      <ul class="admin-nav">
        <li><button class="admin-nav-btn active" onclick="switchTab('orders', this)">📋 Manage Orders</button></li>
        <li><button class="admin-nav-btn" onclick="switchTab('reviews', this)">⭐ Customer Reviews</button></li>
        <li><a href="index.html" class="admin-nav-link">⬅ Back to Live Site</a></li>
      </ul>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1 id="pageTitle">Recent Orders</h1>
        <div class="admin-stats">
          <div class="stat-pill">Total Records: <strong id="totalCount">0</strong></div>
        </div>
      </header>

      <section id="ordersView" class="admin-view active">
        <div class="table-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Customer</th>
                <th>Phone</th>
                <th>Total</th>
                <th>Type</th>
                <th>Items / Notes</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody">
              <tr><td colspan="6" style="text-align:center;">Loading orders from database...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section id="reviewsView" class="admin-view" style="display: none;">
        <div class="table-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Reviewer</th>
                <th>Rating</th>
                <th>Feedback</th>
              </tr>
            </thead>
            <tbody id="reviewsTableBody">
              <tr><td colspan="4" style="text-align:center;">Loading reviews from database...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
